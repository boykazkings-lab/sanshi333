name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout the code
        uses: actions/checkout@v4

      # 2. Configuration de l'environnement Java (JDK 17 recommandé pour la majorité des projets récents)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      # 3. Attribution des permissions d'exécution au script Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Exécution des tests unitaires (optionnel mais fortement recommandé)
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 5. Compilation et génération du fichier APK (mode Debug)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Sauvegarde et mise à disposition de l'APK généré (Artifact)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

